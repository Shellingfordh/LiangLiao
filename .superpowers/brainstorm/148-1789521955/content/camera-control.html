<h2>镜头随生活状态切换，还是由用户控制？</h2>
<p class="subtitle">已确定：默认是人物优先。现在只决定“发生咖啡馆事件”时，谁来把镜头从前景切到中景。</p>
<div class="control-grid">
  <div class="control-card" data-choice="automatic-camera" onclick="toggleSelect(this)">
    <div class="phone"><div class="bar">LOS ANGELES · 18:42 <span class="mode">自动</span></div><div class="scene"><div class="caption">她还在咖啡馆</div><div class="table"></div><div class="cup"></div><div class="persona mid"></div></div><div class="chat"><div class="bubble">刚喝了一口已经凉掉的咖啡。</div><div class="input">写点什么…</div></div></div>
    <div class="sequence"><span class="step">闲聊：前景</span><span class="step active">事件：中景</span><span class="step">结束：前景</span></div>
    <h3>A. 由事件自动切镜头</h3><p>平时是人物近中景；发生可见生活事件时自动退到中景，回复后自然回到前景。</p>
  </div>
  <div class="control-card" data-choice="manual-camera" onclick="toggleSelect(this)">
    <div class="phone"><div class="bar">LOS ANGELES · 18:42 <span class="mode">中景 ⌄</span></div><div class="scene"><div class="caption">她还在咖啡馆</div><div class="table"></div><div class="cup"></div><div class="persona mid"></div></div><div class="chat"><div class="bubble">刚喝了一口已经凉掉的咖啡。</div><div class="input">写点什么…</div></div></div>
    <div class="sequence"><span class="step active">用户选前景 / 中景</span></div>
    <h3>B. 顶部给用户切换</h3><p>用户随时选择前景或中景，体验更自主，但首版多一个控制点和状态同步问题。</p>
  </div>
</div>
